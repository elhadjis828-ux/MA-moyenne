<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Moyenne</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header id="tete">
        <h1>Calculer ma moyenne</h1>
    </header>
       <main>
        <form id="form-calculateur">
          
                <legend>Saisie des matières et notes</legend>
                  <fieldset>
                <!-- Conteneur principal des champs de matières -->
                <div id="container">
                    <div class="ligne-matiere">
                        <label for="matiere1">Matière  :</label>
                        <input type="text" id="matiere1" class="nom" placeholder="Nom de la matière">

                        <label for="note1">Note (/20) :</label>
                        <input type="number" id="note1" class="note" min="0" max="20" step="0.25" placeholder="Ex: 14">

                        <label for="coef1">Coefficient :</label>
                        <input type="number" id="coef1" class="coeff" min="0.5" step="0.5" value="1">
                    </div>

                    <div class="ligne-matiere">
                        <label for="matiere2">Matière 2 :</label>
                        <input type="text" id="matiere2" class="nom" placeholder="Nom de la matière">

                        <label for="note2">Note (/20) :</label>
                        <input type="number" id="note2" class="note" min="0" max="20" step="0.25" placeholder="Ex: 12">

                        <label for="coef2">Coefficient :</label>
                        <input type="number" id="coef2" class="coeff" min="0.5" step="0.5" value="1">
                    </div>

                    <div class="ligne-matiere">
                        <label for="matiere3">Matière 3 :</label>
                        <input type="text" id="matiere3" class="nom" placeholder="Nom de la matière">

                        <label for="note3">Note (/20) :</label>
                        <input type="number" id="note3" class="note" min="0" max="20" step="0.25" placeholder="Ex: 16">

                        <label for="coef3">Coefficient :</label>
                        <input type="number" id="coef3" class="coeff" min="0.5" step="0.5" value="1">
                    </div>

                    <br>
                    
                <button type="button" onclick="ajouterMatiere()">Ajouter une matière</button>
            </fieldset>

            <br>

            <!-- Actions du formulaire -->
            <button type="button" onclick="calculerMoyenne()">Calculer la moyenne</button>
            <button type="reset">Effacer tout</button>
        </form>

        <br>

        <!-- Zone d'affichage du résultat -->
        <section>
            <h2>Résultat</h2>
            <p>Moyenne générale : <output id="moyenne-finale">-- / 20</output></p>
        </section>
    </main>

</body>
</html>
